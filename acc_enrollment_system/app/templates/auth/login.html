{% extends "base.html" %}
{% block title %}Login · ACC Enrollment{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to access the ACC Enrollment System.</p>
    <form method="post" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email
            <input type="email" name="email" required maxlength="255" autocomplete="email">
        </label>
        <label>Password
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button class="btn primary full" type="submit">Sign in</button>
    </form>
    <p class="center muted">No account? <a href="{{ url_for('auth.register') }}">Register as a student</a></p>
</section>
{% endblock %}
